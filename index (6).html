<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ましろの星占い</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+JP:wght@300;400;600;700&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{height:100%}
body{min-height:100%;background:#04020a;font-family:'Noto Serif JP',serif;color:#e8d9b8;overflow-x:hidden}

#stars{position:fixed;inset:0;z-index:0;pointer-events:none}

body::before{content:'';position:fixed;inset:0;z-index:0;pointer-events:none;
  background:radial-gradient(ellipse at 15% 20%,rgba(80,20,120,0.55) 0%,transparent 45%),
    radial-gradient(ellipse at 85% 80%,rgba(20,40,100,0.4) 0%,transparent 45%),
    radial-gradient(ellipse at 50% 50%,rgba(60,10,80,0.35) 0%,transparent 60%)}

/* 幕レイヤー - クリックを通さない */
#curtain{position:fixed;inset:0;z-index:50;display:flex;pointer-events:none}
.cl,.cr{width:50%;height:100%;pointer-events:none;
  background:linear-gradient(to bottom,#1a0830,#0d0420 40%,#1a0830);
  position:relative;overflow:hidden;
  transition:transform 1.8s cubic-bezier(0.76,0,0.24,1)}
.cl::before,.cr::before{content:'';position:absolute;inset:0;
  background:repeating-linear-gradient(90deg,transparent,transparent 18px,rgba(100,50,180,0.08) 18px,rgba(100,50,180,0.08) 20px)}
.cl::after{content:'';position:absolute;top:0;right:0;width:30%;height:100%;
  background:linear-gradient(to left,rgba(160,100,255,0.12),transparent)}
.cr::after{content:'';position:absolute;top:0;left:0;width:30%;height:100%;
  background:linear-gradient(to right,rgba(160,100,255,0.12),transparent)}
.edge{position:absolute;top:0;height:100%;width:8px;
  background:linear-gradient(to bottom,#c084fc,#f0d070,#c084fc,#f0d070,#c084fc)}
.cl .edge{right:0}.cr .edge{left:0}

.cl.open{transform:translateX(-100%)}
.cr.open{transform:translateX(100%)}

/* オープニング画面 - 幕の上に表示、クリック可能 */
#opening{position:fixed;inset:0;z-index:200;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  transition:opacity 0.6s ease}
#opening.hide{opacity:0;pointer-events:none}

.op-title{font-size:clamp(28px,6vw,52px);font-weight:700;letter-spacing:0.3em;
  background:linear-gradient(135deg,#f0d070,#e0a0ff,#80b0ff);
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;
  margin-bottom:12px;animation:glow 2s ease-in-out infinite}
@keyframes glow{0%,100%{filter:brightness(1)}50%{filter:brightness(1.3)}}
.op-sub{font-size:13px;letter-spacing:0.35em;color:#9070b0;margin-bottom:48px}

.op-btn{background:linear-gradient(135deg,rgba(120,50,200,0.6),rgba(60,80,200,0.6));
  border:1px solid rgba(200,140,255,0.6);border-radius:100px;
  padding:16px 56px;font-family:'Noto Serif JP',serif;
  font-size:18px;font-weight:300;letter-spacing:0.3em;color:#e8d9b8;
  cursor:pointer;transition:all 0.3s;
  box-shadow:0 0 40px rgba(120,50,200,0.3)}
.op-btn:hover{transform:translateY(-3px);box-shadow:0 16px 48px rgba(140,60,255,0.5);border-color:rgba(220,160,255,0.9)}

/* メインコンテンツ */
#main{position:relative;z-index:10;opacity:0;transition:opacity 1s ease;pointer-events:none}
#main.show{opacity:1;pointer-events:all}

.wrap{max-width:640px;margin:0 auto;padding:50px 20px 80px;position:relative;z-index:1}

.stage{text-align:center;margin-bottom:40px}
.stage-date{font-size:11px;letter-spacing:0.3em;color:#6040a0;margin-bottom:24px}

.img-wrap{position:relative;display:inline-block;margin-bottom:28px}
.halo{position:absolute;inset:-30px;border-radius:50%;
  background:radial-gradient(circle,rgba(140,60,255,0.25) 0%,rgba(60,80,200,0.15) 40%,transparent 70%);
  animation:halopulse 3s ease-in-out infinite}
@keyframes halopulse{0%,100%{transform:scale(1);opacity:0.7}50%{transform:scale(1.1);opacity:1}}
.ring1{position:absolute;inset:-10px;border-radius:50%;
  border:2px solid transparent;
  background:conic-gradient(from 0deg,#c084fc,#f0d070,#818cf8,#c084fc) border-box;
  -webkit-mask:linear-gradient(#fff 0 0) padding-box,linear-gradient(#fff 0 0);
  mask:linear-gradient(#fff 0 0) padding-box,linear-gradient(#fff 0 0);
  -webkit-mask-composite:destination-out;mask-composite:exclude;
  animation:spin1 6s linear infinite}
@keyframes spin1{to{transform:rotate(360deg)}}
.ring2{position:absolute;inset:-18px;border-radius:50%;
  border:1px solid rgba(180,100,255,0.2);
  animation:spin2 12s linear infinite reverse}
@keyframes spin2{to{transform:rotate(360deg)}}
.mimg{width:220px;height:220px;border-radius:50%;object-fit:cover;object-position:center 15%;
  border:4px solid #04020a;position:relative;z-index:1;display:block;
  animation:float 6s ease-in-out infinite;box-shadow:0 0 40px rgba(120,50,200,0.4)}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-12px)}}

.mtitle{font-size:clamp(24px,5vw,40px);font-weight:700;letter-spacing:0.2em;
  background:linear-gradient(135deg,#f0d070,#d080ff,#80b0ff);
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;margin-bottom:8px}
.msub{font-size:12px;letter-spacing:0.3em;color:#7050a0}

.divider{display:flex;align-items:center;justify-content:center;gap:16px;margin:36px 0 24px;
  color:#5a4070;font-size:14px;letter-spacing:0.3em}
.divider::before,.divider::after{content:'';flex:1;height:1px;
  background:linear-gradient(to right,transparent,rgba(150,80,220,0.4),transparent)}

.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:28px}
.sz{background:rgba(60,10,100,0.2);border:1px solid rgba(150,60,220,0.15);
  border-radius:12px;padding:12px 4px 10px;cursor:pointer;
  display:flex;flex-direction:column;align-items:center;gap:4px;
  transition:all 0.3s;color:#e8d9b8;position:relative;overflow:hidden}
.sz::before{content:'';position:absolute;inset:0;
  background:radial-gradient(circle at 50% 0%,rgba(160,80,255,0.2),transparent 70%);
  opacity:0;transition:opacity 0.3s}
.sz:hover{border-color:rgba(180,80,255,0.5);transform:translateY(-3px);box-shadow:0 8px 24px rgba(100,40,180,0.35)}
.sz:hover::before{opacity:1}
.sz.on{background:rgba(100,30,180,0.35);border-color:rgba(200,100,255,0.7);box-shadow:0 0 24px rgba(150,60,255,0.4)}
.sz.on::before{opacity:1}
.sz-s{font-size:20px;line-height:1}.sz-n{font-size:11px;color:#b090d0;letter-spacing:0.04em}
.sz.on .sz-n{color:#e8c8ff}.sz-d{font-size:8px;color:#6a4880}

.card{background:rgba(15,4,30,0.7);border:1px solid rgba(130,60,200,0.25);
  border-radius:20px;padding:40px 28px;position:relative;overflow:hidden;
  backdrop-filter:blur(16px);min-height:200px}
.card::before{content:'';position:absolute;inset:0;pointer-events:none;
  background:radial-gradient(circle at 10% 10%,rgba(100,40,180,0.2),transparent 40%),
    radial-gradient(circle at 90% 90%,rgba(40,60,180,0.15),transparent 40%)}
.cc{position:absolute;font-size:18px;color:#c084fc;opacity:0.3}
.cc1{top:14px;left:18px}.cc2{top:14px;right:18px}.cc3{bottom:14px;left:18px}.cc4{bottom:14px;right:18px}

.init{display:flex;flex-direction:column;align-items:center;justify-content:center;
  min-height:120px;gap:24px;position:relative;z-index:1}
.hint{font-size:14px;color:#7050a0;letter-spacing:0.1em}
.go{background:linear-gradient(135deg,rgba(100,40,200,0.5),rgba(50,70,200,0.5));
  border:1px solid rgba(180,100,255,0.5);border-radius:100px;
  padding:14px 48px;font-family:'Noto Serif JP',serif;font-size:16px;font-weight:300;
  letter-spacing:0.25em;color:#e8d9b8;cursor:pointer;transition:all 0.4s}
.go:hover:not(:disabled){transform:translateY(-3px);box-shadow:0 12px 40px rgba(120,50,255,0.45);border-color:rgba(210,140,255,0.8)}
.go:disabled{opacity:0.3;cursor:not-allowed;transform:none}

.res{display:none;flex-direction:column;gap:22px;position:relative;z-index:1}
.res-top{display:flex;align-items:flex-start;justify-content:space-between;
  padding-bottom:18px;border-bottom:1px solid rgba(130,60,200,0.2)}
.res-left{display:flex;align-items:center;gap:14px}
.res-sym{font-size:36px;filter:drop-shadow(0 0 12px rgba(180,100,255,0.7))}
.res-name{font-size:22px;font-weight:700;letter-spacing:0.12em;
  background:linear-gradient(135deg,#f0d070,#c084fc);
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
.res-rank{font-size:11px;letter-spacing:0.15em;color:#7050a0;margin-top:3px}
.stars-row{display:flex;gap:4px}
.star{font-size:16px;color:#f0d070;filter:drop-shadow(0 0 4px rgba(240,200,80,0.6))}
.star.e{color:rgba(180,140,255,0.12);filter:none}
.res-body{font-size:16px;font-weight:300;line-height:2.5;color:#cfc0e8;
  white-space:pre-line;letter-spacing:0.05em;animation:fadeup 0.8s ease both}
@keyframes fadeup{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:translateY(0)}}
.lucky-box{background:linear-gradient(135deg,rgba(60,30,10,0.5),rgba(50,20,70,0.5));
  border:1px solid rgba(230,170,50,0.3);border-radius:12px;padding:16px 20px;
  display:flex;align-items:center;gap:14px}
.lucky-ico{font-size:22px}
.lucky-lbl{font-size:10px;letter-spacing:0.25em;color:#c09030;margin-bottom:4px}
.lucky-val{font-size:15px;color:#f0d070;letter-spacing:0.06em}
.res-foot{display:flex;align-items:center;justify-content:space-between;
  padding-top:18px;border-top:1px solid rgba(130,60,200,0.15)}
.sig{font-size:12px;color:#6040a0;letter-spacing:0.1em}
.re{background:none;border:1px solid rgba(130,60,200,0.3);border-radius:100px;
  padding:7px 20px;font-family:'Noto Serif JP',serif;font-size:12px;color:#7050a0;
  cursor:pointer;transition:all 0.2s;letter-spacing:0.08em}
.re:hover{border-color:rgba(180,100,255,0.6);color:#c084fc}
.footer{text-align:center;margin-top:40px;font-size:11px;letter-spacing:0.25em;color:#3a2050}

.shoot{position:fixed;height:1px;pointer-events:none;z-index:2;
  background:linear-gradient(to right,transparent,rgba(255,255,255,0.9),transparent);
  animation:sh linear forwards}
@keyframes sh{from{opacity:1;transform:translate(0,0) rotate(15deg);width:0}
  to{opacity:0;transform:translate(280px,140px) rotate(15deg);width:150px}}
</style>
</head>
<body>
<canvas id="stars"></canvas>

</div>

  <button class="op-btn" onclick="openCurtain()">🔮 占いを始める</button>
</div>

function openCurtain(){
  // オープニングを非表示
  var op=document.getElementById('opening');
  op.style.opacity='0';
  op.style.pointerEvents='none';
  // 幕を開く
  document.getElementById('cl').classList.add('open');
  document.getElementById('cr').classList.add('open');
  // メインを表示
  setTimeout(function(){
    var main=document.getElementById('main');
    main.classList.add('show');
    // 幕を完全に削除
    setTimeout(function(){
      document.getElementById('curtain').style.display='none';
    },500);
  },1200);
}

'牡羊座':[
{t:"今日は勢いが味方してくれる日です。\n迷っていたことに思い切って踏み出してみて。\n周囲も自然とあなたのペースに引き込まれるでしょう。",l:"赤いアイテム"},
{t:"積極的な行動が吉を呼びます。\n朝のうちに大事な連絡を済ませておくと良さそう。\nエネルギーが満ちているので新しいことを始めるのに最適です。",l:"コーヒー"},
{t:"今日は直感を信じてみてください。\n少し無謀に思えることでも案外うまくいくかも。\n夕方以降は気持ちが落ち着いてきます。",l:"スニーカー"},

{t:"今日は自分のペースを大切にしてください。\n焦らずゆっくり進めることで結果が出ます。\n美しいものを見るとインスピレーションが湧きます。",l:"観葉植物"},
{t:"丁寧さが運を引き寄せる日です。\n細かいところまで気を配ると周囲から信頼されます。\n夜は好きな音楽でくつろいでみて。",l:"ハーブティー"},

{t:"アイデアが次々と浮かぶ日です。\nメモをとっておくと後で役に立ちます。\n多方面に意識を向けると収穫がありそう。",l:"ノート"},

var R=["第1位✨","第2位","第3位","第4位","第5位","第6位","第7位","第8位","第9位","第10位","第11位","第12位"];
function rnd(s){var x=Math.sin(s)*10000;return x-Math.floor(x)}
function ds(e){return d.getFullYear()*10000+(d.getMonth()+1)*100+d.getDate()+e}

function sel(btn,sym,name,idx){
  document.querySelectorAll('.sz').forEach(function(b){b.classList.remove('on')});
  btn.classList.add('on');ss=sym;sn=name;si=idx;
  document.getElementById('goBtn').disabled=false;
  document.getElementById('hint').textContent=sym+' '+name+'の運勢を占います';
  document.getElementById('resSt').style.display='none';
  document.getElementById('initSt').style.display='flex';
}

function starsHtml(n){var s='';for(var i=0;i<5;i++)s+='<span class="star'+(i<n?' ':'e')+'">★</span>';return s}

function showF(){
  if(!sn)return;
  var list=F[sn],seed=ds(si*77);
  var f=list[Math.floor(rnd(seed)*list.length)];
  var ri=Math.floor(rnd(seed+1)*12),st=Math.floor(rnd(seed+2)*3)+3;
  document.getElementById('rSym').textContent=ss;
  document.getElementById('rName').textContent=sn;
  document.getElementById('rRank').textContent='今日のランキング '+R[ri];
  document.getElementById('rStars').innerHTML=starsHtml(st);
  document.getElementById('rBody').textContent=f.t;
  document.getElementById('rLucky').textContent=f.l;
  document.getElementById('initSt').style.display='none';
  document.getElementById('resSt').style.display='flex';
  for(var i=0;i<7;i++)(function(i){setTimeout(function(){
    var s=document.createElement('div');s.className='shoot';
    s.style.top=Math.random()*60+'%';s.style.left=Math.random()*70+'%';
    s.style.animationDuration=(0.7+Math.random()*0.6)+'s';
    document.body.appendChild(s);setTimeout(function(){s.remove()},1500);
  },i*120)})(i);
}

(function(){
  var c=document.getElementById('stars'),ctx=c.getContext('2d');
  function resize(){c.width=window.innerWidth;c.height=window.innerHeight}
  resize();window.addEventListener('resize',resize);
  var stars=[];
  for(var i=0;i<200;i++)stars.push({x:Math.random(),y:Math.random(),r:Math.random()*1.2+0.2,a:Math.random(),da:(Math.random()-0.5)*0.006});
  function draw(){
    ctx.clearRect(0,0,c.width,c.height);
    stars.forEach(function(s){
      s.a+=s.da;if(s.a>1||s.a<0)s.da*=-1;
      ctx.beginPath();ctx.arc(s.x*c.width,s.y*c.height,s.r,0,Math.PI*2);
      ctx.fillStyle='rgba(255,255,255,'+Math.max(0,Math.min(1,s.a))+')';ctx.fill();
    });
    requestAnimationFrame(draw);
  }
  draw();
})();
</script>
